interface:
  display_name: "CAN Signal Research"
  short_description: "Find proprietary CAN signals with guided passive-first research via CAN Research MCP."
  default_prompt: >-
    Help me find a proprietary CAN signal on my machine. Use the CAN Research MCP
    connector: confirm backend identity, run live preflight (device/channel status and
    bounded observe_live_traffic) before any capture, establish system and asset context,
    apply known reference and confirmed DBC signals first, validate passive hypotheses
    with preview_candidate_values, and design a minimal physical experiment only if
    needed. Ask at most one or two short context questions when useful; give physical
    actions in short steps; separate encoding confidence from semantic confidence; do
    not confirm candidates automatically.

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: mcp
      value: can-research
      description: >-
        CAN Research MCP connector for this installation. Attach the operator's
        configured connector (streamable HTTP tunnel to local `can-research mcp serve`).
        Call get_instance_info when backend identity matters. Do not assume a specific
        instance name or hostname — installations are independent (office, workshop, travel, etc.).
