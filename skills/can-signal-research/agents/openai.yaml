interface:
  display_name: "CAN Signal Research"
  short_description: "CAN reverse-engineering workbench — standards-first inventory, contextual inference, research DBC."
  default_prompt: >-
    Help me reverse-engineer CAN signals on my machine. Use CAN Research MCP: confirm
    backend, preflight live traffic, inventory the bus standards-first (J1939/ISOBUS +
    local DBC knowledge), isolate proprietary remainder, reuse layout fingerprints,
    apply contextual reasoning and preview_candidate_values, run one targeted experiment
    only if needed (experiment evidence beats naive rankers), produce a concise Markdown
    research summary and research DBC preview when useful, separate structural from
    semantic confidence, and stop at CLI confirmation. Passive RX only.

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: mcp
      value: can-research
      description: >-
        CAN Research MCP connector for this installation. Attach the operator's
        configured connector (streamable HTTP tunnel to local `can-research mcp serve`).
        Call get_instance_info when backend identity matters. Do not assume a specific
        instance name or hostname — installations are independent (office, workshop, travel, etc.).
